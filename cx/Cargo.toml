[package]
name = "cx"
version = "0.2.0"
edition = "2024"
description = "Codex launcher with Proton Pass secret injection"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dotenvy = "0.15"
open = "5"
owo-colors = { version = "4", features = ["supports-colors"] }
serde_json = "1"
sysinfo = "0.38"
which = "8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
